apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-demo
  namespace: crud-demo
  labels:
    app: crud-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crud-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: crud-demo
    spec:
      containers:
        - name: crud-demo
          image: IMAGE_PLACEHOLDER  # replaced by CI/CD pipeline
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
